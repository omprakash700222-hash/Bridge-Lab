    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }

        .section {
            padding: 30px 15px;
            background-color: rgb(248, 250, 252);
        }

        /* h1 {
            font-size: 28px;
            margin-bottom: 40px;
            background-color: aquamarine;

        .card-container {
            display: grid;
            grid-template-columns: 200px 200px 200px;
            padding: 25px;
            gap: 20px;
            justify-content: center;
            background-color: rgb(248, 253, 253);
        }

        .movie-card {
            width: 200px;
            height: 360px;
            border: 1px solid #ddd;
            border-radius: 16px;
            background-color: white;
            overflow: hidden;
            /* transition: all,0,5s; */
            opacity: 0;
            animation: cardanimation 1s ease-in forwards;
            
        }

        .movie-image {
            overflow: hidden;
        }

        .movie-image img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
           
        }
        .movie-card:hover {
            transform: translateY(-15px);
            box-shadow: 0 10px 20px rgba(53, 235, 3, 0.2);
        }

        .movie-card:hover .movie-image img {
            transform: scale(1.08);
        }

        .movie-info {
            padding: 5px;
        }

        .movie-card:nth-child(1){
            animation-delay: 0.1s;
        }
        .movie-card:nth-child(2){
            animation-delay: 0.2s;
        }
        .movie-card:nth-child(3){
            animation-delay: 0.3s;
        }
        .movie-card:nth-child(4){
            animation-delay: 0.4s;
        }
        .movie-card:nth-child(5){
            animation-delay: 0.5s;
        }
        .movie-card:nth-child(6){
            animation-delay: 0.6s;
        }

        @keyframes cardanimation{
            from{
                opacity: 0;
                transform: translateY(30px);
            }
            to{
                opacity: 1;
                transform: translateY(0px);
            }
        }

        .movie-title {
            font-size: 15px;
            margin-bottom: 8px;
        }

        .movie-details {
            font-size: 14px;
            color: #555;
            margin-bottom: 8px;
        }

        .movie-info button{
            width: 80px;
            height: 35px;
            color: #ddd;
            border-color: #ddd;
            background-color: black;
            border-radius: 10px;
        }

        .booking-popup{
            position: fixed;
            top: 35px;
            right: 40px;

            display: flex;
            align-items: center;
            gap: 12px;

            width: 200px;
            height: 50px;
            background-color: green;
            padding: 20px;

            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(170, 3, 3, 0.2);

            transform: translate-X(120%);
            transition: transform 0.5s ease;
            color: white;
            z-index:1000;
        }
        .booking-popup.show{
            translate: translateX(0);
        }
        .check {
        width: 30px;
        height: 30px;

        display: flex;
        align-items: center;
        justify-content: center;

        background-color: green;
        color: white;

        border-radius: 50%;
        font-size: 20px;
        }



    </style>
</head>
